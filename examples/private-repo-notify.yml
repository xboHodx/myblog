# 把这个文件放到【私有内容仓库】的 .github/workflows/notify-blog.yml
#
# 作用：私有仓库 push 之后，远程触发博客仓库的 Deploy blog workflow。
# 博客仓库监听的是 repository_dispatch 事件类型 content-update。
#
# 私有仓库需要配置：
#   变量 BLOG_REPO           = 你的博客仓库，例如 octocat/myblog
#   secret BLOG_DISPATCH_TOKEN = 一个能对博客仓库发 dispatch 的 token
#       经典 PAT：勾选 repo
#       细粒度 PAT：只勾选博客仓库，权限 Contents: Read and write
#
# 注意：repository_dispatch 只在博客仓库的【默认分支】上找 workflow 文件，
# 所以 deploy.yml 必须已经合并进 main。

name: Notify blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog rebuild
        env:
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
          REPO: ${{ vars.BLOG_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ] || [ -z "${REPO:-}" ]; then
            echo "::error::缺少 secret BLOG_DISPATCH_TOKEN 或变量 BLOG_REPO"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d '{"event_type":"content-update"}')
          if [ "$code" != "204" ]; then
            echo "::error::dispatch 失败（HTTP $code）"
            cat /tmp/resp.json
            exit 1
          fi
          echo "已触发 $REPO 的博客构建"
